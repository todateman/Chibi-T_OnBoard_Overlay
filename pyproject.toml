[project]
name = "ecorun-overlay"
version = "0.2.0"
description = "エコラン用テレメトリ・オーバーレイ生成ツール(レイアウト GUI エディタ付き)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.110",
    "numpy>=1.23",
    "pandas>=1.5",
    "pillow>=10.0",
    "pydantic>=2.6",
    "tomlkit>=0.12",
    "uvicorn>=0.29",
]

[project.scripts]
ecorun-overlay = "ecorun.cli:main"
ecorun-layout = "ecorun.layout:main"
ecorun-gui = "ecorun.gui.server:main"
ecorun-sync = "ecorun.ocrsync:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ecorun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
